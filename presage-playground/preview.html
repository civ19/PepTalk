<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; worker-src 'self' blob:;">
  <title>SmartSpectra Live Preview</title>
  <link rel="stylesheet" href="preview.css">
</head>
<body>
  <main>
    <header>
      <h1>Live vitals</h1>
      <p>Face the camera with your face and upper chest visible.</p>
    </header>
    <div class="layout">
      <section class="camera" aria-label="Camera preview">
        <video id="preview" autoplay muted playsinline></video>
        <div id="camera-placeholder">Camera preview appears when you start</div>
      </section>
      <section class="readings" aria-label="Current readings">
        <div class="reading"><span>Heart rate</span><strong id="heart-rate">—</strong><small>BPM</small></div>
        <div class="reading"><span>Breathing rate</span><strong id="breathing-rate">—</strong><small>breaths/min</small></div>
        <p id="status" role="status">Ready</p>
        <p id="hint" aria-live="polite"></p>
        <button id="toggle" type="button">Start camera</button>
      </section>
    </div>
    <p class="note">Pulse can take about 12 seconds to settle; breathing can take about 30 seconds.</p>
  </main>
  <script src="dist/preview.js"></script>
</body>
</html>
